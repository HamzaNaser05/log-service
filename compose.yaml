services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: log_service
      POSTGRES_USER: log_service
      POSTGRES_PASSWORD: log_service

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U log_service -d log_service"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g

  app:
    build:
      context: .

    environment:
      PORT: "8080"

      DATABASE_URL:
        "postgresql://log_service:log_service@postgres:5432/log_service"

      RETENTION_DAYS:
        "${RETENTION_DAYS:-7}"

      PARTITION_AHEAD_DAYS:
        "${PARTITION_AHEAD_DAYS:-2}"

      INGESTION_MAX_IN_FLIGHT:
        "${INGESTION_MAX_IN_FLIGHT:-4}"

      INGESTION_RETRY_AFTER_SECONDS:
        "${INGESTION_RETRY_AFTER_SECONDS:-1}"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: