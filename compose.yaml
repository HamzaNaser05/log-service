services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: log_service
      POSTGRES_USER: log_service
      POSTGRES_PASSWORD: log_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U log_service -d log_service",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: